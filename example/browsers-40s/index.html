<!doctype html>
<html><head><meta charset="utf-8"><title>How browsers work - 40s</title>
<style>html,body{margin:0;background:#070b18;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
'use strict';
const Q = new URLSearchParams(location.search);
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080);
const DURATION = 40, FPS = 30;
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const g = cv.getContext('2d');
const portrait = H > W;
const S = Math.min(W, H) / 1080;
const FONT = '"DejaVu Sans", sans-serif', MONO = '"DejaVu Sans Mono", monospace';
const C = { bg: '#070b18', board: '#0f1630', edge: '#26315a', ink: '#e9edf9', dim: '#8390b5', amber: '#ffb547', blue: '#4ea8ff',
  green: '#5ee6a8', pink: '#ff6b9a', violet: '#b28cff', panel: '#161f3f', red: '#ff5d5d' };

// ---------------- pure helpers ----------------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOut = x => 1 - Math.pow(1 - x, 3);
const eInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const pop = (t, at, d = 0.35) => { const x = prog(t, at, at + d); return x <= 0 ? 0 : eBack(x); };  // exact 0 before the event (eBack(0) is 2e-16, not 0)
const fade = (t, at, d = 0.3) => eOut(prog(t, at, at + d));
function rngFor(key) { let h = 1779033703 ^ key.length; for (let i = 0; i < key.length; i++) { h = Math.imul(h ^ key.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  let a = h >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const P = (lx, ly, px, py) => portrait ? [px * W, py * H] : [lx * W, ly * H];

function text(str, x, y, size, color, align = 'center', weight = '600', maxW = W * 0.84, font = FONT) {
  let s = size; g.font = `${weight} ${s}px ${font}`;
  while (g.measureText(str).width > maxW && s > 8) { s -= 1; g.font = `${weight} ${s}px ${font}`; }
  g.fillStyle = color; g.textAlign = align; g.textBaseline = 'middle'; g.fillText(str, x, y); return s;
}
function rrect(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, Math.min(r, h / 2, w / 2)); }
function box(x, y, w, h, r, fill, stroke, lw = 3 * S) { rrect(x, y, w, h, r); if (fill) { g.fillStyle = fill; g.fill(); } if (stroke) { g.lineWidth = lw; g.strokeStyle = stroke; g.stroke(); } }
function withAlpha(a, fn) { if (a <= 0) return; const ga = g.globalAlpha; g.globalAlpha = ga * clamp(a); fn(); g.globalAlpha = ga; }
function wrap(str, maxW, font) { g.font = font; const words = str.split(' '); const lines = []; let cur = '';
  for (const w of words) { const n = cur ? cur + ' ' + w : w; if (g.measureText(n).width > maxW && cur) { lines.push(cur); cur = w; } else cur = n; } if (cur) lines.push(cur); return lines; }
function title(str, t, a) { withAlpha(fade(t, a - 0.9, 0.5), () => text(str, W / 2, portrait ? H * 0.115 : H * 0.135, (portrait ? 64 : 60) * S, C.ink, 'center', '700', W * 0.86)); }
function caption(str, t, a, b = 99, y) { const al = Math.min(fade(t, a, 0.3), 1 - prog(t, b - 0.25, b)); withAlpha(al, () => text(str, W / 2, y || (portrait ? H * 0.885 : H * 0.865), (portrait ? 40 : 36) * S, C.dim, 'center', '500', W * 0.84)); }
function chip(label, x, y, col, k = 1, size = 34, fillHot = false, font = MONO) {
  if (k <= 0) return; g.font = `600 ${size * S}px ${font}`; const w = g.measureText(label).width + 36 * S, h = size * S * 1.8;
  g.save(); g.translate(x, y); g.scale(k, k); box(-w / 2, -h / 2, w, h, h / 2, fillHot ? col : C.panel, col, 3 * S);
  text(label, 0, 0, size * S, fillHot ? C.bg : C.ink, 'center', '600', 9999, font); g.restore(); return w;
}
function arrow(x0, y0, x1, y1, k, col, lw = 4 * S, dash) {
  if (k <= 0) return; const x = lerp(x0, x1, k), y = lerp(y0, y1, k);
  g.save(); g.strokeStyle = col; g.lineWidth = lw; if (dash) g.setLineDash(dash); g.beginPath(); g.moveTo(x0, y0); g.lineTo(x, y); g.stroke(); g.setLineDash([]);
  const a = Math.atan2(y1 - y0, x1 - x0), hs = 16 * S; g.fillStyle = col; g.beginPath(); g.moveTo(x, y); g.lineTo(x - hs * Math.cos(a - .45), y - hs * Math.sin(a - .45)); g.lineTo(x - hs * Math.cos(a + .45), y - hs * Math.sin(a + .45)); g.fill(); g.restore();
}
function quadPt(a, c, b, k) { return [(1 - k) * (1 - k) * a[0] + 2 * (1 - k) * k * c[0] + k * k * b[0], (1 - k) * (1 - k) * a[1] + 2 * (1 - k) * k * c[1] + k * k * b[1]]; }

// ---------------- timeline (picture and score read the same numbers) ----------------
const URL_TEXT = 'https://example.com/';
const TL = {
  scenes: [[0, 6], [6, 12], [12, 17], [17, 23], [23, 28.5], [28.5, 33.5], [33.5, 40]],
  hw: 0.75,                                   // camera flight half-width around each cut
  type: [0.75, 2.25], enter: 2.5, anatomy: [3.0, 3.5, 4.0],
  pk: [ // [from,to,start,dur,label,color]
    ['L', 'D', 6.75, 0.75, 'example.com ?', C.amber], ['D', 'L', 7.75, 0.75, '93.184.215.14', C.green],
    ['L', 'S', 8.75, 0.45, 'SYN', C.blue], ['S', 'L', 9.25, 0.45, 'SYN-ACK', C.blue], ['L', 'S', 9.75, 0.45, 'ACK', C.blue],
    ['L', 'S', 10.0, 0.45, 'TLS hello', C.violet], ['S', 'L', 10.5, 0.45, 'certificate', C.violet], ['L', 'S', 11.0, 0.5, 'GET /', C.amber]],
  ip: 8.5, serverGlow: 11.5,
  hdr: [12.5, 13.0, 13.5], code0: 14.0, codeStep: 0.25, bytes: [14.0, 16.25],
  nodes0: 17.5, nodeStep: 0.5, sweep: 21.0,
  rules: [23.5, 24.0, 24.5], merge: 25.25, rnodes: [26.0, 26.5, 27.0], strikes: [26.25, 27.25],
  frame: 28.75, boxes: [29.0, 29.5, 30.0], measure: 30.5, resize: [31.0, 32.0], unsize: [32.5, 33.0],
  recs: [34.0, 34.5, 35.0, 35.5], split: 36.0, mergeL: 37.0, grid: 37.5, pull: [38.0, 39.6], tag: 38.25,
};
const charTimes = [...URL_TEXT].map((_, i) => TL.type[0] + (TL.type[1] - TL.type[0]) * i / (URL_TEXT.length - 1));
const pkArrive = TL.pk.map(p => +(p[2] + p[3]).toFixed(2));

// ---------------- world: boards on a snake grid ----------------
const GX = W * 1.12, GY = H * 1.14;
const CELLS = portrait ? [[0, 0], [1, 0], [1, 1], [0, 1], [0, 2], [1, 2], [1, 3]] : [[0, 0], [1, 0], [2, 0], [3, 0], [3, 1], [2, 1], [1, 1]];
const CEN = CELLS.map(([c, r]) => [c * GX, r * GY]);
const BW = W * 0.93, BH = H * 0.9;
const ext = CEN.reduce((b, [x, y]) => [Math.min(b[0], x), Math.min(b[1], y), Math.max(b[2], x), Math.max(b[3], y)], [1e9, 1e9, -1e9, -1e9]);
const WORLD_C = [(ext[0] + ext[2]) / 2, (ext[1] + ext[3]) / 2 + (portrait ? 0.2 : 0.18) * GY * 0.5];
const FIT_Z = Math.min(W * 0.94 / (ext[2] - ext[0] + BW), H * (portrait ? 0.74 : 0.7) / (ext[3] - ext[1] + BH));

function holdCam(i, t) { const [a, b] = TL.scenes[i]; const k = prog(t, a, b);
  return [CEN[i][0] + W * 0.012 * Math.sin(t * 0.6 + i), CEN[i][1] + H * 0.01 * Math.cos(t * 0.5 + i), 1 + 0.035 * k]; }
function camera(t) {
  let cam = null;
  for (let i = 0; i < TL.scenes.length - 1; i++) {
    const b = TL.scenes[i][1];
    if (t >= b - TL.hw && t <= b + TL.hw) { const e = eInOut(prog(t, b - TL.hw, b + TL.hw)); const A = holdCam(i, t), B = holdCam(i + 1, t);
      cam = [lerp(A[0], B[0], e), lerp(A[1], B[1], e), lerp(A[2], B[2], e) * (1 - 0.42 * Math.sin(Math.PI * e)), i, e]; break; }
  }
  if (!cam) { let i = TL.scenes.findIndex(([a, b]) => t >= a && t < b); if (i < 0) i = TL.scenes.length - 1; const h = holdCam(i, t); cam = [h[0], h[1], h[2], -1, 0]; }
  const e2 = eInOut(prog(t, TL.pull[0], TL.pull[1]));
  if (e2 > 0) { cam[0] = lerp(cam[0], WORLD_C[0], e2); cam[1] = lerp(cam[1], WORLD_C[1], e2); cam[2] = Math.exp(lerp(Math.log(cam[2]), Math.log(FIT_Z * (1 + 0.03 * prog(t, TL.pull[1], 40))), e2)); }
  return cam;
}

// ---------------- icons ----------------
function laptop(x, y, s, glow) { g.save(); g.translate(x, y); const w = 150 * s, h = 96 * s;
  box(-w / 2, -h, w, h, 10 * s, C.panel, glow ? C.amber : C.blue, 4 * s); g.fillStyle = 'rgba(78,168,255,0.25)'; g.fillRect(-w / 2 + 12 * s, -h + 12 * s, w - 24 * s, h - 24 * s);
  g.fillStyle = C.blue; g.beginPath(); g.moveTo(-w * 0.62, 12 * s); g.lineTo(w * 0.62, 12 * s); g.lineTo(w * 0.52, 0); g.lineTo(-w * 0.52, 0); g.fill(); g.restore(); }
function globe(x, y, s, t) { g.save(); g.translate(x, y); const r = 62 * s; g.strokeStyle = C.green; g.lineWidth = 4 * s; g.fillStyle = C.panel;
  g.beginPath(); g.arc(0, 0, r, 0, 7); g.fill(); g.stroke(); g.beginPath(); g.moveTo(-r, 0); g.lineTo(r, 0); g.stroke();
  for (const k of [-0.5, 0.5]) { g.beginPath(); g.moveTo(-r * Math.sqrt(1 - k * k), r * k); g.lineTo(r * Math.sqrt(1 - k * k), r * k); g.stroke(); }
  const sp = Math.sin(t * 1.2) * 0.9; g.beginPath(); g.ellipse(0, 0, Math.abs(r * sp), r, 0, 0, 7); g.stroke(); g.beginPath(); g.ellipse(0, 0, r * 0.35, r, 0, 0, 7); g.stroke(); g.restore(); }
function server(x, y, s, glow, t) { g.save(); g.translate(x, y); const w = 130 * s, h = 44 * s;
  for (let i = 0; i < 3; i++) { const yy = -h * 3 + i * (h + 8 * s); box(-w / 2, yy, w, h, 8 * s, C.panel, glow > 0 ? C.amber : C.pink, 4 * s);
    for (let j = 0; j < 3; j++) { const on = glow > 0 ? (Math.floor(t * 8 + i * 3 + j) % 3 !== 0) : j === 0; g.fillStyle = on ? (glow > 0 ? C.amber : C.green) : '#33406a'; g.beginPath(); g.arc(w / 2 - 20 * s - j * 18 * s, yy + h / 2, 5 * s, 0, 7); g.fill(); }
    g.fillStyle = '#33406a'; g.fillRect(-w / 2 + 16 * s, yy + h / 2 - 3 * s, 50 * s, 6 * s); }
  if (glow > 0) { g.globalAlpha *= 0.25 * glow; g.fillStyle = C.amber; g.beginPath(); g.arc(0, -h * 1.4, 130 * s, 0, 7); g.fill(); }
  g.restore(); }

// ---------------- scene 1: URL ----------------
function scene1(t) {
  const [tx, ty] = P(0.5, 0.2, 0.5, 0.3);
  text('How browsers work', tx, ty, (portrait ? 92 : 100) * S, C.ink, 'center', '700');
  withAlpha(1, () => text('the whole trip, in 40 seconds', tx, ty + 82 * S, 40 * S, C.amber, 'center', '500'));
  const bw = portrait ? W * 0.84 : Math.min(W * 0.72, 1300 * S), bh = 118 * S; const [bx0, by0] = P(0.5, 0.46, 0.5, 0.52); const bx = bx0 - bw / 2, by = by0 - bh / 2;
  const flash = t > TL.enter ? Math.exp(-(t - TL.enter) * 5) : 0;
  withAlpha(1, () => {
    g.save(); g.translate(bx0, by0); g.scale(1 + flash * 0.04, 1 + flash * 0.04); g.translate(-bx0, -by0);
    box(bx, by, bw, bh, bh / 2, C.panel, `rgba(255,181,71,${0.35 + 0.65 * flash})`, 4 * S);
    const lx = bx + 58 * S, ly = by + bh / 2, u = 11 * S; g.strokeStyle = C.green; g.lineWidth = 4 * S; g.beginPath(); g.arc(lx, ly - u * 0.6, u * 0.9, Math.PI, 0); g.stroke(); g.fillStyle = C.green; rrect(lx - u * 1.3, ly - u * 0.5, u * 2.6, u * 2, 4 * S); g.fill();
    const n = charTimes.filter(c => c <= t).length, shown = URL_TEXT.slice(0, n); const fs = 54 * S; g.font = `500 ${fs}px ${MONO}`;
    const x0 = bx + 100 * S; text(shown, x0, ly, fs, C.ink, 'left', '500', 9999, MONO);
    if (t < TL.enter + 0.3 && Math.floor(t * 2.5) % 2 === 0) { g.fillStyle = C.amber; g.fillRect(x0 + g.measureText(shown).width + 4 * S, by + bh * 0.24, 4 * S, bh * 0.52); }
    // anatomy brackets
    const seg = [[0, 5, 'scheme', C.blue], [8, 19, 'host', C.amber], [19, 20, 'path', C.green]];
    g.font = `500 ${fs}px ${MONO}`;
    seg.forEach(([s0, s1, lab, col], i) => { const k = pop(t, TL.anatomy[i]); if (k <= 0) return;
      const xa = x0 + g.measureText(URL_TEXT.slice(0, s0)).width, xb = x0 + g.measureText(URL_TEXT.slice(0, s1)).width; const yb = by + bh + 26 * S;
      withAlpha(clamp(k), () => { g.strokeStyle = col; g.lineWidth = 4 * S; g.beginPath(); g.moveTo(xa + 2 * S, yb - 10 * S); g.lineTo(xa + 2 * S, yb); g.lineTo(xb - 2 * S, yb); g.lineTo(xb - 2 * S, yb - 10 * S); g.stroke();
        const lyy = yb + (i === 2 ? 90 : 46) * S; if (i === 2) { g.beginPath(); g.moveTo((xa + xb) / 2, yb); g.lineTo((xa + xb) / 2, lyy - 24 * S); g.stroke(); }
        g.save(); g.translate((xa + xb) / 2, lyy); g.scale(k, k); text(lab, 0, 0, 34 * S, col, 'center', '600'); g.restore();
        if (i === 1) { g.globalAlpha *= 0.14 + 0.1 * Math.sin(t * 5); g.fillStyle = col; g.fillRect(xa, by + 14 * S, xb - xa, bh - 28 * S); } });
    });
    g.restore();
    const lp = eInOut(prog(t, TL.enter, TL.enter + 0.5)); if (lp > 0 && t < TL.anatomy[0]) { g.fillStyle = C.amber; g.fillRect(bx + bh / 2, by + bh - 8 * S, (bw - bh) * lp, 5 * S); }
  });
  caption('First the browser needs the server\'s address', t, 4.5);
}

// ---------------- scene 2: DNS + handshake + request ----------------
const NODES2 = { L: [0.17, 0.66, 0.28, 0.33], D: [0.5, 0.42, 0.72, 0.5], S: [0.83, 0.66, 0.28, 0.7] };
const np2 = k => P(...NODES2[k]);
function pathCtrl(a, b, from, to) { const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
  if ((from + to).includes('L') && (from + to).includes('S')) return portrait ? [mx - W * 0.2, my] : [mx, my + H * 0.2];
  return [mx, my - (portrait ? 0 : H * 0.05)]; }
function scene2(t) {
  title('1. Find the server', t, 6);
  const [lx, ly] = np2('L'), [dx, dy] = np2('D'), [sx, sy] = np2('S'); const s = (portrait ? 1.15 : 1.1) * S;
  // faint routes
  withAlpha(0.35 * fade(t, 5.8, 0.6), () => { for (const [f, to] of [['L', 'D'], ['L', 'S']]) { const a = np2(f), b = np2(to), c = pathCtrl(a, b, f, to);
    g.strokeStyle = C.edge; g.lineWidth = 3 * S; g.setLineDash([10 * S, 10 * S]); g.beginPath(); g.moveTo(a[0], a[1] - 40 * S); g.quadraticCurveTo(c[0], c[1] - 40 * S, b[0], b[1] - 40 * S); g.stroke(); g.setLineDash([]); } });
  const sg = clamp((t - TL.serverGlow) / 0.4);
  withAlpha(fade(t, 5.5), () => { laptop(lx, ly, s, false); text('Your browser', lx, ly + 50 * S, 32 * S, C.ink, 'center', '600'); });
  withAlpha(fade(t, 5.7), () => { globe(dx, dy - 40 * S, s, t); text('DNS resolver', dx, dy + 50 * S, 32 * S, C.ink, 'center', '600'); });
  withAlpha(fade(t, 5.9), () => { server(sx, sy, s, sg, t); text('example.com server', sx, sy + 50 * S, 32 * S, C.ink, 'center', '600'); });
  const ipk = pop(t, TL.ip); if (ipk > 0) chip('IP 93.184.215.14', lx, ly + 104 * S, C.green, ipk, 26);
  TL.pk.forEach(([f, to, st, du, lab, col]) => { if (t < st || t > st + du + 0.25) return; const a = np2(f), b = np2(to), c = pathCtrl(a, b, f, to);
    const k = eInOut(prog(t, st, st + du)); const q = quadPt([a[0], a[1] - 40 * S], [c[0], c[1] - 40 * S], [b[0], b[1] - 40 * S], k);
    const al = 1 - prog(t, st + du, st + du + 0.25);
    withAlpha(al, () => { g.strokeStyle = col; g.lineWidth = 5 * S; g.beginPath(); for (let j = 0; j <= 20; j++) { const kk = k * j / 20, p = quadPt([a[0], a[1] - 40 * S], [c[0], c[1] - 40 * S], [b[0], b[1] - 40 * S], kk); j ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]); } g.stroke();
      chip(lab, q[0], q[1], col, 1, 28, true); }); });
  caption('DNS turns the name into an IP address', t, 6.6, 8.6);
  caption('TCP + TLS handshake: a secure connection', t, 8.6, 10.9);
  caption('Then the request: GET /', t, 10.9);
}

// ---------------- scene 3: response ----------------
const CODE = ['<!doctype html>', '<html>', '  <head><title>Example</title></head>', '  <body>', '    <h1>Hello, browser</h1>', '    <p>Browsers turn code into pixels.</p>', '    <img src="cat.png">', '  </body>', '</html>'];
function codeLine(str, x, y, size) { g.font = `500 ${size}px ${MONO}`; g.textAlign = 'left'; g.textBaseline = 'middle'; let cx = x;
  for (const part of str.split(/(<[^>]+>)/)) { if (!part) continue; g.fillStyle = part.startsWith('<') ? C.blue : C.ink;
    if (part.startsWith('<') && part.includes('=')) { const [a, b] = part.split('='); g.fillStyle = C.blue; g.fillText(a + '=', cx, y); cx += g.measureText(a + '=').width; g.fillStyle = C.amber; g.fillText(b, cx, y); cx += g.measureText(b).width; continue; }
    g.fillText(part, cx, y); cx += g.measureText(part).width; } }
function scene3(t) {
  title('2. The server responds', t, 12);
  const [hx, hy, hw, hh] = portrait ? [W * 0.07, H * 0.18, W * 0.86, H * 0.17] : [W * 0.06, H * 0.25, W * 0.36, H * 0.34];
  const [cx, cy, cw, ch] = portrait ? [W * 0.07, H * 0.385, W * 0.86, H * 0.43] : [W * 0.45, H * 0.23, W * 0.49, H * 0.58];
  withAlpha(fade(t, 11.6, 0.5), () => { box(hx, hy, hw, hh, 20 * S, C.panel, C.green, 3 * S); box(cx, cy, cw, ch, 20 * S, C.panel, C.blue, 3 * S);
    text('response headers', hx + 24 * S, hy + 34 * S, 26 * S, C.dim, 'left', '600'); text('body: HTML', cx + 24 * S, cy + 34 * S, 26 * S, C.dim, 'left', '600'); });
  const H3 = ['HTTP/2 200 OK', 'content-type: text/html', 'content-length: 1256'];
  H3.forEach((line, i) => { const k = prog(t, TL.hdr[i], TL.hdr[i] + 0.35); if (k <= 0) return; const n = Math.ceil(line.length * k);
    const fs = (portrait ? 34 : 32) * S; const yy = hy + (portrait ? 78 : 86) * S + i * fs * 1.55;
    text(line.slice(0, n), hx + 24 * S, yy, fs, i === 0 ? C.green : C.ink, 'left', i === 0 ? '700' : '500', hw - 48 * S, MONO); });
  const ok = pop(t, TL.hdr[0] + 0.4); if (ok > 0) chip('200', hx + hw - 70 * S, hy + 34 * S, C.green, ok, 24, true);
  const fs = (portrait ? 30 : 29) * S, lh = fs * 1.6;
  CODE.forEach((line, i) => { const st = TL.code0 + i * TL.codeStep; const k = eOut(prog(t, st, st + 0.3)); if (k <= 0) return;
    withAlpha(k, () => codeLine(line, cx + 28 * S + (1 - k) * 40 * S, cy + 84 * S + i * lh, fs)); });
  // bytes bar
  const bp = eInOut(prog(t, TL.bytes[0], TL.bytes[1]));
  const [bx, by, bw] = portrait ? [W * 0.07, H * 0.845, W * 0.86] : [W * 0.06, H * 0.68, W * 0.36];
  withAlpha(fade(t, 13.8), () => { box(bx, by, bw, 18 * S, 9 * S, '#1c2650', null); if (bp > 0) box(bx, by, bw * bp, 18 * S, 9 * S, C.blue, null);
    text(`${Math.round(1256 * bp)} / 1256 bytes`, bx, by + 50 * S, 30 * S, C.ink, 'left', '600', bw, MONO); });
  if (!portrait) caption('HTML arrives as a stream of bytes', t, 16.0, 99, H * 0.865);
}

// ---------------- scene 4: DOM ----------------
const DOM = [['html', null], ['head', 'html'], ['body', 'html'], ['title', 'head'], ['h1', 'body'], ['p', 'body'], ['img', 'body']];
const DOMPOS = portrait
