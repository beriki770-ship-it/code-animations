name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions: {}
jobs:
  harness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: npm ci
        working-directory: harness
      # The runner image ships Google Chrome at /usr/bin/google-chrome, which lib.mjs finds on its own.
      - run: node harness/verify.mjs example/browser-10s/index.html --format 16x9
      - run: node harness/verify.mjs example/browser-10s/index.html --format 9x16
      - run: node harness/audio.mjs example/browser-10s/index.html --twice
      - run: node harness/render.mjs example/browser-10s/index.html --format 16x9 --out out/ci.mp4
      - run: bash harness/qa.sh out/ci.mp4 1
